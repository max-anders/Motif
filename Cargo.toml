[package]
name = "motif"
version = "0.1.0"
edition = "2021"
description = "Motif: experimental music sketchpad (piano roll + soft piano / CLAP-VST3)"
repository = "https://github.com/max-anders/Motif"

# Dev builds keep motif code debuggable (opt-level 1) while optimizing deps
# so the audio callback stays within the ~5 ms buffer budget.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
base64 = "0.22"
cpal = "0.15"
directories = "6"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
rubato = "4.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.0", features = ["mp3", "flac", "vorbis", "isomp4", "pcm"] }
truce-rack = { version = "1.1", features = ["clap", "vst3"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same major as eframe's winit; used to force X11 for plugin editor hosting.
winit = { version = "0.30", default-features = false, features = ["x11"] }
# Feature `xlib` makes build.rs link libX11 (needed for shared-Display editor parents).
x11 = { version = "2.21", features = ["xlib"] }
raw-window-handle = "0.6"

# Vendored, patched plugin-host wrappers: upstream 1.1.5 never drives the plugin's
# Linux event loop (VST3 has no IPlugFrame/IRunLoop; CLAP passes a null clap_host),
# so embedded editors paint but never receive mouse/keyboard. Our copies add the
# host-side run loop (IRunLoop for VST3, timer + posix-fd support for CLAP) and pump
# it from PluginEditor::on_idle. See vendor/*/PATCH-NOTES.md.
[patch.crates-io]
truce-rack-vst3 = { path = "vendor/truce-rack-vst3" }
truce-rack-clap = { path = "vendor/truce-rack-clap" }
